[project]
name = "cfbsim"
version = "0.1.0"
description = "College football matchup predictions from statistical models evaluated on games they never saw."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "altair>=5.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cfbsim = "cfbsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfbsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
